default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", nil) %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "dayflow_development") %>

test:
  <<: *default
  database: dayflow_test

# Production reads DATABASE_URL (e.g. postgres://user:pass@host:5432/dayflow).
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
